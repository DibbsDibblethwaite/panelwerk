[package]
name = "panelwerk-nice"
description = "Panelwerk's held edits on nice-plug: the panel's ParamHost over a plugin's parameters, and the edits still open handed to the main thread as its window goes"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
publish.workspace = true

# The one crate here that depends on the framework (CLAUDE.md, Layout; Ian,
# 2026-11-23, PW-BUILT, point 1 (a)). nice-plug exactly 0.4.2 because every
# consumer redirects that version, and only it, to its own vendored and
# patched copy with `[patch.crates-io]` (W-2a): another version would not be
# patched, and the consumer would build two nice-plugs. No default features:
# the consumer chooses its wrappers; `editor` for `EditorHandle`, which every
# consumer's plugin enables already. The panel, for `ParamHost` and `Held`.
[dependencies]
nice-plug = { version = "=0.4.2", default-features = false, features = ["editor"] }
panelwerk-panel = { path = "../panelwerk-panel" }

# The tests drive the adapter through nice-plug's real VST3 wrapper, as
# Kör's and Fläns's do (`tests/vst3_host`), and draw with the test kit.
[dev-dependencies]
nice-plug = { version = "=0.4.2", default-features = false, features = ["editor", "vst3"] }
panelwerk-testkit = { path = "../panelwerk-testkit" }
